# Sampling follows the Ornith model card's "precise coding" profile:
# https://huggingface.co/ornith-ai/Ornith-1.5-9B-GGUF
- name: openai/ornith-1.5-9b
  edit_format: diff
  use_repo_map: false
  use_temperature: 0.6
  streaming: true
  # LM Studio returns thinking in reasoning_content; this strips it if it ever leaks into content.
  reasoning_tag: think
  extra_params:
    # Thinking alone measured ~6k tokens on a one-function task, so the answer needs headroom.
    max_tokens: 16000
    top_p: 0.95
    top_k: 20
    min_p: 0
